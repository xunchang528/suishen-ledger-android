<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>随身账本</title><style>body{font-family:system-ui;background:#101827;color:#eef3ff;margin:0;padding:20px}h1{font-size:24px}.card{background:#1e293b;border-radius:18px;padding:18px;margin:14px 0}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:5px 0;border:0;border-radius:10px;font-size:16px}button{background:#46c5ac;color:#071b18;font-weight:700}input,select{background:#334155;color:white}small{color:#a9b8ce}.line{display:flex;justify-content:space-between;border-bottom:1px solid #34445b;padding:10px 0}.line:last-child{border:0}</style></head><body><h1>随身账本</h1><small>所有账本数据保存在本机；支付通知需手动授权</small><section class="card"><small>账户合计余额（根据记录估算）</small><h1 id="total">¥0.00</h1><div id="accounts"></div></section><section class="card"><h3>添加收入或支出</h3><select id="type"><option value="expense">支出</option><option value="income">收入</option></select><select id="account"><option value="wechat">微信</option><option value="alipay">支付宝</option><option value="bank">银行卡</option><option value="cash">现金</option></select><input id="amount" type="number" min="0.01" step="0.01" placeholder="金额（元）"><input id="note" placeholder="备注 / 商户"><button onclick="add()">保存记录</button></section><section class="card"><h3>账户初始余额</h3><select id="balanceAccount"><option value="wechat">微信</option><option value="alipay">支付宝</option><option value="bank">银行卡</option><option value="cash">现金</option></select><input id="balance" type="number" step="0.01" placeholder="设置初始余额"><button onclick="setBalance()">保存初始余额</button></section><section class="card"><h3>支付通知自动记账</h3><small>开启后尝试识别微信和支付宝支付成功通知。通知可能遗漏或误识别，请定期核对。</small><button onclick="AndroidLedger.openNotificationSettings()">开启通知读取权限</button><button onclick="sync()">同步待处理支付通知</button><small id="status"></small></section><section class="card"><h3>本月统计</h3><div id="summary"></div></section><section class="card"><h3>交易明细</h3><div id="history"></div></section><section class="card"><h3>本地备份与恢复</h3><button onclick="backup()">导出 JSON 备份</button><input type="file" accept=".json,application/json" onchange="restore(event)"><small>卸载应用或清除应用数据可能导致账本丢失，请定期备份。</small></section><script>
const names={wechat:'微信',alipay:'支付宝',bank:'银行卡',cash:'现金'},key='suishen-v1';let db;
try{db=JSON.parse(localStorage.getItem(key))||{balances:{},records:[]}}catch(e){db={balances:{},records:[]}}
function save(){localStorage.setItem(key,JSON.stringify(db));render()}
function add(){let v=Number(document.getElementById('amount').value);if(!Number.isFinite(v)||v<=0)return alert('请输入有效金额');db.records.unshift({id:'m'+Date.now(),type:document.getElementById('type').value,account:document.getElementById('account').value,amount:v,note:document.getElementById('note').value,date:new Date().toISOString()});document.getElementById('amount').value='';document.getElementById('note').value='';save()}
function setBalance(){let v=Number(document.getElementById('balance').value);if(!Number.isFinite(v))return;db.balances[document.getElementById('balanceAccount').value]=v;save()}
function render(){let total=0;document.getElementById('accounts').innerHTML=Object.keys(names).map(k=>{let val=(db.balances[k]||0)+db.records.filter(r=>r.account===k).reduce((s,r)=>s+(r.type==='income'?1:-1)*r.amount,0);total+=val;return '<div class="line"><span>'+names[k]+'</span><b>¥'+val.toFixed(2)+'</b></div>'}).join('');document.getElementById('total').textContent='¥'+total.toFixed(2);let month=new Date().toISOString().slice(0,7),items=db.records.filter(r=>r.date.slice(0,7)===month),sum=t=>items.filter(r=>r.type===t).reduce((s,r)=>s+r.amount,0);document.getElementById('summary').innerHTML='<div class="line">收入 ¥'+sum('income').toFixed(2)+'</div><div class="line">支出 ¥'+sum('expense').toFixed(2)+'</div>';document.getElementById('history').innerHTML=db.records.slice(0,100).map(r=>'<div class="line"><span>'+names[r.account]+' · '+(r.note||'交易')+'<br><small>'+r.date.slice(0,16).replace('T',' ')+'</small></span><b>'+(r.type==='expense'?'-':'+')+'¥'+Number(r.amount).toFixed(2)+'</b></div>').join('')||'暂无记录'}
function sync(){try{let arr=JSON.parse(AndroidLedger.getPending()),count=0;arr.forEach(r=>{if(!db.records.some(x=>x.id===r.id)){db.records.unshift({id:r.id,type:'expense',account:r.source,amount:r.amount,note:r.note,date:r.date});count++}AndroidLedger.ack(r.id)});save();document.getElementById('status').textContent='已同步 '+count+' 笔记录'}catch(e){document.getElementById('status').textContent='同步失败：'+e.message}}
function backup(){AndroidLedger.saveBackup('suishen-backup.json',JSON.stringify(db))}
function restore(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.records)||typeof d.balances!=='object')throw Error('格式不符');if(confirm('恢复备份将覆盖现有账本，确定继续？')){db=d;save()}}catch(err){alert('备份文件无效')}};reader.readAsText(f)}
window.addEventListener('android-notifications',sync);render();sync();
</script></body></html>
